version: 2

models:

  - name: dim_customers
    description: "Customer dimension with lifetime metrics and loyalty tier"
    config:
      contract:
        enforced: true

    columns:
      - name: customer_id
        data_type: varchar
        tests:
          - not_null
          - unique

      - name: first_name
        data_type: varchar

      - name: last_name
        data_type: varchar

      - name: email
        data_type: varchar

      - name: signup_date
        data_type: date

      - name: first_order_date
        data_type: date

      - name: lifetime_orders
        data_type: integer

      - name: lifetime_net_revenue
        data_type: numeric

      - name: loyalty_tier
        data_type: varchar

  - name: dim_products
    description: "Product dimension with category, brand and pricing attributes"

    columns:
      - name: product_id
        data_type: varchar

      - name: category
        data_type: varchar
        tests:
          - accepted_values:
              values:
                - ELECTRONICS
                - FASHION
                - GROCERY
                - HOME
                - BEAUTY
                - OTHER

  - name: fct_orders_daily
    description: "Daily order-level fact table"
    latest_version: 2

    versions:
      - v: 1
        description: "Initial daily order fact with net revenue only"
        config:
          contract:
            enforced: true
          on_schema_change: fail

        columns:
          - name: order_id
            data_type: varchar

          - name: order_date
            data_type: date

          - name: net_amount
            data_type: numeric

      - v: 2
        description: "Adds gross, discount and payment status"
        config:
          contract:
            enforced: true
          on_schema_change: append_new_columns

        columns:
          - name: order_id
            data_type: varchar
            tests:
              - not_null

          - name: order_date
            data_type: date
            tests:
              - not_null

          - name: customer_id
            data_type: varchar
            tests:
              - relationships:
                  to: ref('dim_customers')
                  field: customer_id

          - name: gross_amount
            data_type: numeric

          - name: discount_amount
            data_type: numeric

          - name: net_amount
            data_type: numeric
            tests:
              - order_net_amount_non_negative

          - name: total_paid_amount
            data_type: numeric

          - name: total_refunded_amount
            data_type: numeric

          - name: net_paid_amount
            data_type: numeric

          - name: payment_status
            data_type: varchar